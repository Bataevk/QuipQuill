<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs><filter id="p" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" stitchTiles="stitch" result="fine"/>
  <feColorMatrix in="fine" type="saturate" values="0" result="fineMono"/>
  <feComponentTransfer in="fineMono" result="fineSoft"><feFuncR type="linear" slope="0.16" intercept="0.9"/><feFuncG type="linear" slope="0.16" intercept="0.9"/><feFuncB type="linear" slope="0.16" intercept="0.9"/><feFuncA type="linear" slope="0" intercept="1"/></feComponentTransfer>
  <feTurbulence type="fractalNoise" baseFrequency="0.0117" numOctaves="3" seed="11" stitchTiles="stitch" result="mottle"/>
  <feColorMatrix in="mottle" type="saturate" values="0" result="mottleMono"/>
  <feComponentTransfer in="mottleMono" result="mottleSoft"><feFuncR type="linear" slope="0.1" intercept="0.94"/><feFuncG type="linear" slope="0.1" intercept="0.94"/><feFuncB type="linear" slope="0.1" intercept="0.94"/><feFuncA type="linear" slope="0" intercept="1"/></feComponentTransfer>
  <feBlend in="SourceGraphic" in2="fineSoft" mode="multiply" result="a"/>
  <feBlend in="a" in2="mottleSoft" mode="multiply"/>
</filter></defs>
<rect width="512" height="512" fill="#F4ECDD" filter="url(#p)"/>
</svg>
