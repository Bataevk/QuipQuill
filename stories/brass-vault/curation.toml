# Manual fixes for the extracted graph of "The Brass Vault".
#
# Tied to the committed graph.json: re-extraction renames entities (the LLM words them a little
# differently each run) and `builder curate` will list every rule that no longer matches.
#
# Apply (from builder/):
#   uv run builder curate ../stories/brass-vault/graph.json ../stories/brass-vault/curation.toml \
#       -o ../stories/brass-vault/graph.curated.json
# Format: builder/src/quipquill_builder/curation.py

# --- Near-duplicates the fuzzy merge missed (different wording for the same thing) ---------------
[merge]
"The Rusty Gear Tavern" = ["Back room of The Rusty Gear Tavern", "Back room"]
"Grand Hall of the Ashcombe Mercantile Bank" = ["Grand Hall", "ballroom"]
"Ashcombe Mercantile Bank" = ["the bank", "Ashcombe bank"]
"Director's Office" = ["Office"]
"Boiler Undercroft" = ["boiler room"]
"brass punch card" = ["director's brass punch card", "punched brass card"]
"wall safe" = ["small wall safe"]
"tuning fork of blued steel" = ["tuning fork"]
"grappling hook with coil of silk rope" = ["grappling hook"]
"hand-drawn plan" = ["bank plan"]
"pneumatic post terminal" = ["terminal behind the head teller's desk"]
"pneumatic post" = ["pneumatic tubes"]
"rusted iron hatch" = ["iron hatch"]

# --- Noise: world-level mentions, backstory, the player ------------------------------------------
[drop]
entities = [
    "Vellmoor",                         # the whole city; lives in world_summary
    "The player",                       # the player character is created at session start
    "The Crew",
    "guard",                            # generic "most guards carry truncheons"
    "messenger boys",
    "airship",
    "Mags Holloway's former airship",
    "revolver",
    "pepperbox pistol",
    "clockwork automaton",              # the general idea; Sentinel Unit Seven is the real one
    "steam surge",                      # a mechanic, kept in Bertha's and the Sentinel's personas
    "Admiralty patrol ship",            # Juno's knowledge, not part of the scene
]

[retype]
"brass punch card" = "Tool"
"grated drain" = "Tool"
"rusted iron hatch" = "Tool"
"Royal Observatory" = "Organization"   # Horace's dream, not a place in the story

# --- Things that cannot be picked up (the GM's take tool refuses `fixed` entities) ----------------
[props]
"Orrery Lock" = { fixed = true }
"great round door" = { fixed = true }
"wall safe" = { fixed = true }
"emergency chute" = { fixed = true }
"pneumatic post terminal" = { fixed = true }
"pneumatic post" = { fixed = true }
"rusted iron hatch" = { fixed = true }
"grated drain" = { fixed = true }
"main pressure valve" = { fixed = true }
"boiler number three" = { fixed = true }
"alarm bell" = { fixed = true }
"green lamp" = { fixed = true }
"cage lift" = { fixed = true }
"bronze plaque" = { fixed = true }
"crate" = { fixed = true }
"Wren's Promise" = { fixed = true }

