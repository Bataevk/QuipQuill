blurb = "A curious girl who follows the White Rabbit"
description = "A curious, well-mannered, talkative girl of seven from a comfortable Victorian home, with long hair and a pinafore dress. She is bored on the riverbank beside her sister's dull book, loves to recite lessons (and gets them wrong), and talks to herself when no one else will listen. Brave in an ordinary way: she follows the White Rabbit without once considering how in the world she is to get out again. Carries nothing at all, and misses her cat Dinah."
