# --- Playable map ---

[[add_relation]]
source = "Riverbank"
target = "The Rabbit-Hole"
type = "LEADS_TO"
description = "A large rabbit-hole under the hedge; it dips suddenly down into a very deep well."

[[add_relation]]
source = "The Rabbit-Hole"
target = "Hall of Doors"
type = "LEADS_TO"
description = "The long fall ends on a heap of sticks and dry leaves, and a passage leads to a long, low hall."

[[add_relation]]
source = "Hall of Doors"
target = "Pool of Tears"
type = "LEADS_TO"
description = "Past the far end of the hall the floor slopes down into a wide salt pool: the Pool of Tears, deep enough to swim in."

[[add_relation]]
source = "Pool of Tears"
target = "Shore of the Pool"
type = "LEADS_TO"
description = "The pool's bank, crowded with dripping birds and animals."

[[add_relation]]
source = "Shore of the Pool"
target = "The Wood"
type = "LEADS_TO"
description = "Past the bank, a thick wood begins."

[[add_relation]]
source = "The Wood"
target = "White Rabbit's House"
type = "LEADS_TO"
description = "A neat little house with a brass plate: W. RABBIT."

[[add_relation]]
source = "The Wood"
target = "Caterpillar's Mushroom"
type = "LEADS_TO"
description = "Among the flowers and grass stands a mushroom as tall as a little girl."

[[add_relation]]
source = "The Wood"
target = "Duchess's House"
type = "LEADS_TO"
description = "An open place with a little house about four feet high."

[[add_relation]]
source = "The Wood"
target = "March Hare's House"
type = "LEADS_TO"
description = "A house with chimneys shaped like ears and a roof thatched with fur."

[[add_relation]]
source = "The Wood"
target = "Tree with a Door"
type = "LEADS_TO"
description = "One of the trees has a door leading right into it."

[[add_relation]]
source = "Tree with a Door"
target = "Hall of Doors"
type = "LEADS_TO"
description = "Through the door in the tree: the long hall again, close to the little glass table."

[[add_relation]]
source = "Hall of Doors"
target = "The Queen's Garden"
type = "LEADS_TO"
description = "The little door, fifteen inches high, opens with the golden key — for someone small enough."

[[add_relation]]
source = "The Queen's Garden"
target = "Sea-Shore"
type = "LEADS_TO"
description = "The Gryphon knows the way to the Mock Turtle's ledge by the sea."

[[add_relation]]
source = "The Queen's Garden"
target = "Court of Justice"
type = "LEADS_TO"
description = "The trial is beginning: everyone hurries to the court."

[[add_relation]]
source = "Tidy Little Room"
target = "White Rabbit's House"
type = "LOCATED_IN"
description = "Upstairs in the Rabbit's house."

[[add_relation]]
source = "Duchess's Kitchen"
target = "Duchess's House"
type = "LOCATED_IN"
description = "The door leads right into a large kitchen, full of smoke."

