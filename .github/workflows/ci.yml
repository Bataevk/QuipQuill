# Builder and the mobile core: tests, lint, types. Cloud has its own workflow (cloud.yml).
name: ci

on:
  push:
    paths: ["builder/**", "apps/mobile/**", "schema/**", "stories/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["builder/**", "apps/mobile/**", "schema/**", "stories/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  builder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: builder
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test
