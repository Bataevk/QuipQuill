<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- resizes-content: the on-screen keyboard shrinks the page, so the game's field stays above it (Android Chrome, stage T.1). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, interactive-widget=resizes-content" />
    <title>foolore</title>
    <meta name="description" content="Stories that answer back. You say what your hero does — the world and its people respond." />
    <!-- The splash's grounds (app.json, ADR 63): no white flash before the app draws (stage W.3). -->
    <meta name="theme-color" content="#F4ECDD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1D1A1E" media="(prefers-color-scheme: dark)" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        background-color: #F4ECDD;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #1D1A1E;
        }
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
