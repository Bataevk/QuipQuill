[project]
name = "quipquill-cloud"
version = "0.1.0"
description = "QuipQuill cloud: auth, LLM gateway and message queue"
readme = "README.md"
authors = [
    { name = "IBatae01", email = "btaev.i@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aio-pika==10.1.1",
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "fastapi[standard]==0.143.0",
    "openai==3.29.0",
    "pwdlib[argon2]==0.3.1",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.1",
    "sqlalchemy[asyncio]==2.1.4",
]

# The uv the lock and the image are made with (Dockerfile, CI): another version warns or refuses.
[tool.uv]
required-version = ">=0.11.17,<0.12"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.fastapi]
entrypoint = "quipquill_cloud.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: live calls to OpenRouter (costs money); run with -m integration"]

[tool.ruff]
line-length = 100
target-version = "py313"
# One-off probes with live calls (stage spikes): kept for the record, not maintained code.
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by Alembic; reviewed, not hand-formatted.
"migrations/versions/*" = ["E501"]
