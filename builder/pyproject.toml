[project]
name = "quipquill-builder"
version = "0.1.0"
description = "QuipQuill story builder: lore text to story graph to .qqstory"
readme = "README.md"
authors = [
    { name = "IBatae01", email = "btaev.i@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx2==2.13.1",
    "openai==3.29.0",
    "pydantic-settings==2.15.0",
    "rapidfuzz==3.14.6",
]

[project.scripts]
builder = "quipquill_builder.cli:main"

# The uv the lock and the image are made with (Dockerfile, CI): another version warns or refuses.
[tool.uv]
required-version = ">=0.11.17,<0.12"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/quipquill_builder/prompts.py" = ["E501"]
