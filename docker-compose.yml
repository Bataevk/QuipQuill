# Local infrastructure for development: `make infra-up`.
# Credentials here are for local use only; real ones live in cloud/.env on servers.
name: quipquill

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: quipquill
      POSTGRES_PASSWORD: quipquill
      POSTGRES_DB: quipquill
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quipquill -d quipquill"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: quipquill
      RABBITMQ_DEFAULT_PASS: quipquill
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
  rabbitmq-data:
