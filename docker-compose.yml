# Local infrastructure: `make infra-up` (Postgres + RabbitMQ for running cloud on the host).
# Whole backend in containers: `make app-up` (adds the `app` profile: migrate + cloud).
# Infrastructure credentials here are for local use only; secrets come from cloud/.env.
name: quipquill

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: quipquill
      POSTGRES_PASSWORD: quipquill
      POSTGRES_DB: quipquill
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quipquill -d quipquill"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.6-management
    environment:
      RABBITMQ_DEFAULT_USER: quipquill
      RABBITMQ_DEFAULT_PASS: quipquill
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    profiles: ["app"]
    build: ./cloud
    image: quipquill-cloud:dev
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://quipquill:quipquill@postgres:5432/quipquill
    depends_on:
      postgres:
        condition: service_healthy

  cloud:
    profiles: ["app"]
    build: ./cloud
    image: quipquill-cloud:dev
    env_file:
      - path: cloud/.env      # JWT_SECRET, OPENROUTER_API_KEY, INVITE_CODES
        required: true
    environment:
      ENV: prod               # refuses to start with a weak JWT secret or no OpenRouter key
      LOG_FORMAT: json
      DATABASE_URL: postgresql+asyncpg://quipquill:quipquill@postgres:5432/quipquill
      RABBITMQ_URL: amqp://quipquill:quipquill@rabbitmq:5672/
      QUEUE_PREFIX: qq.app    # separate from a dev server on the host (qq.dev)
      PROMPTS_DIR: /app/prompts
      STORIES_DIR: /app/stories
    volumes:
      - ./prompts:/app/prompts:ro   # the repository's prompt originals (ADR 57)
      - ./stories:/app/stories:ro   # the story catalogue (ADR 61)
    ports:
      - "8080:8000"           # host 8080, so it can run next to `make cloud-dev` on 8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
